# Debian package definition, built with nfpm (https://nfpm.goreleaser.com).
# Replaces the dpkg-buildpackage machinery in openport-distribution/debian.
#
# Run via packaging/build-debs.sh, which provides the environment variables:
#   VERSION   e.g. 2.2.4  (from the vX.Y.Z git tag)
#   DEB_ARCH  debian architecture: amd64 | armhf | arm64
#   BIN_ARCH  which compiled binary to ship: amd64 | armv6 | arm64
#             (armhf debs ship the armv6 binary -- pi zero segfaults on armhf
#             builds, see docker_compile_all.sh)
name: openport
arch: ${DEB_ARCH}
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: Jan De Bleser <jan@openport.io>
homepage: https://openport.io
license: MIT
description: |
  Expose local ports to the internet.
  Openport creates a tunnel from openport.io to a port on your machine,
  so you can reach it from anywhere.
# Explicit modes everywhere: nfpm otherwise copies whatever mode the build
# left on the source files (a 0700 binary, in one observed case).
contents:
  - src: openport-${BIN_ARCH}
    dst: /usr/bin/openport
    file_info:
      mode: 0755
  # Per-port template unit: systemctl enable --now openport@22
  - src: openport@.service
    dst: /lib/systemd/system/openport@.service
    file_info:
      mode: 0644
  # Boot unit that restarts --restart-on-reboot sessions.
  - src: packaging/openport.service
    dst: /lib/systemd/system/openport.service
    file_info:
      mode: 0644
  # Chrome-style repo self-enrolment: installing the deb configures the signed
  # apt repo, so every install -- including the existing "dpkg -i" user base,
  # once they take this version -- gets future updates via apt.
  - src: packaging/build/openport-archive-keyring.gpg
    dst: /usr/share/keyrings/openport-archive-keyring.gpg
    file_info:
      mode: 0644
  - src: packaging/openport.list
    dst: /etc/apt/sources.list.d/openport.list
    type: config
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
