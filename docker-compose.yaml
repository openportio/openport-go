services:
  client_tests:
    build:
      context: "."
      dockerfile: Dockerfile-amd64
    command: sh -c "/openport-amd64 register ${KEY_REGISTRATION_TOKEN} --server https://test.openport.io && gotestsum --format standard-verbose --junitfile /apps/go/test-results/report.xml ./..."
    user: "${UID}:${GID}"
    volumes:
      - ./src/:/apps/go
      - ./test-results:/apps/go/test-results/
      - ./test-results:/root/.openport/
    environment:
      - HOME=/apps/go/
      - GOCACHE=
      # The module cache lands in the bind-mounted checkout (src/go/pkg/mod);
      # without this Go marks it read-only and the runner's git clean can't
      # remove it, breaking every later job on a reused CI instance.
      - GOFLAGS=-modcacherw
  # // for debugging only
#      - ./src/:/apps/go/src/
